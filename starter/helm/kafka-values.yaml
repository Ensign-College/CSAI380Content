# Values for the bitnami/kafka Helm chart.
# Single broker, no auth — course sandbox only, NEVER production.
#   helm install kafka bitnami/kafka -n <your-namespace> -f helm/kafka-values.yaml

# Bitnami removed legacy tags from docker.io/bitnami in 2025; pull from bitnamilegacy instead
global:
  security:
    allowInsecureImages: true

image:
  repository: bitnamilegacy/kafka

controller:
  replicaCount: 1
  # Persistence lives under controller (KRaft chart) — a top-level `persistence:` block is silently ignored
  persistence:
    enabled: true
    size: 2Gi # small on purpose — shared-cluster disk quota; plenty for exercise topics
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

listeners:
  client:
    protocol: PLAINTEXT # no TLS/auth for the exercise — note why in your README

# Single broker: internal topics must use replication factor 1 or consumer groups never form
overrideConfiguration:
  offsets.topic.replication.factor: 1
  transaction.state.log.replication.factor: 1
  transaction.state.log.min.isr: 1
