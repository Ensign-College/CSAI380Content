# Values for the apache-airflow/airflow Helm chart (Airflow 3).
# This file is the source of truth for Airflow config — change it here, not in the UI.
#   helm upgrade --install airflow apache-airflow/airflow -n <your-namespace> -f helm/airflow-values.yaml
# Resource requests are deliberately small to fit course-sandbox GCP quotas.

executor: KubernetesExecutor

# Run migrations as a regular Job, not a Helm hook — required for `helm --wait` and GitOps tools
migrateDatabaseJob:
  useHelmHooks: false
  applyCustomEnv: false

# Sync DAGs from your course repository
dags:
  gitSync:
    enabled: true
    repo: https://github.com/<your-username>/<your-course-repo>.git
    branch: main
    subPath: dags
    # 3.4 Part Four: try changing this interval and verify the effect
    period: 60s

# Airflow 3 renamed the webserver component to apiServer
apiServer:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

scheduler:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

dagProcessor:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

triggerer:
  persistence:
    enabled: false # avoids PVC binding stalls in the course sandbox
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

statsd:
  enabled: false # not needed for the exercise; saves sandbox quota

# Course sandbox sizing — not production values
workers:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

env: []
# Example for 3.4 Part Four (add a variable and verify it appears in the pod):
#   - name: CSAI380_STUDENT
#     value: "<your-username>"
