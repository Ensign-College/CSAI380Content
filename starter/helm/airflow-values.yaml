# Values for the apache-airflow/airflow Helm chart (Airflow 3).
# This file is the source of truth for Airflow config — change it here, not in the UI.
#   helm upgrade --install airflow apache-airflow/airflow -n <your-namespace> -f helm/airflow-values.yaml
# Resource requests are deliberately small to fit course-sandbox GCP quotas.

executor: KubernetesExecutor

# Run migrations as a regular Job, not a Helm hook — required for `helm --wait` and GitOps tools
migrateDatabaseJob:
  useHelmHooks: false
  applyCustomEnv: false
  resources:
    requests:
      cpu: 100m # explicit — Autopilot defaults unspecified containers to 500m, which can strand the job Pending
      memory: 256Mi

# Sync DAGs from your course repository
dags:
  gitSync:
    enabled: true
    repo: https://github.com/<your-username>/<your-course-repo>.git
    branch: main
    subPath: dags
    # 3.4 Part Four: try changing this interval and verify the effect
    period: 60s
    # Explicit sidecar sizing — GKE Autopilot defaults unspecified containers to 500m/2Gi, which blows the sandbox quota
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

# Airflow 3 renamed the webserver component to apiServer
apiServer:
  # Airflow takes 1-3 minutes to start on small requests; the chart's 1-minute startup window
  # restarts it before it is up, over and over. Allow up to 5 minutes.
  startupProbe:
    failureThreshold: 30
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

scheduler:
  # Same slow start as apiServer; the health check itself starts Airflow, so give it time too
  startupProbe:
    failureThreshold: 30
    timeoutSeconds: 60
  livenessProbe:
    timeoutSeconds: 60
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
  logGroomerSidecar:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

dagProcessor:
  livenessProbe:
    timeoutSeconds: 60
  resources:
    requests:
      cpu: 100m # small — a handful of course DAGs; larger requests strand it Pending on full sandbox nodes
      memory: 256Mi
  logGroomerSidecar:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

triggerer:
  enabled: false # no deferrable operators in this exercise — saves a whole pod of CPU/memory quota
  persistence:
    enabled: false # avoids PVC binding stalls in the course sandbox
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

statsd:
  enabled: false # not needed for the exercise; saves sandbox quota

# Your project's disk quota (SSD_TOTAL_GB) is tight: keep task logs on emptyDir and shrink the metadata DB volume
logs:
  persistence:
    enabled: false

# Task logs go to your raw-data bucket. Each task runs in its own pod, which is deleted when the task ends,
# so without this the UI shows "Could not read served logs" instead of the log you need to troubleshoot.
# Access comes from the Workload Identity binding in terraform/gcs-bucket.tf (no key, no connection needed).
config:
  logging:
    remote_logging: "True"
    remote_base_log_folder: "gs://<project-id>-<your-username>-raw-data/airflow-logs"
    remote_log_conn_id: ""

postgresql:
  primary:
    persistence:
      size: 2Gi

# Course sandbox sizing — not production values
workers:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

env: []
# Example for 3.4 Part Four (add a variable and verify it appears in the pod):
#   - name: CSAI380_STUDENT
#     value: "<your-username>"
