apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-app
  namespace: <your-namespace>
  labels:
    app: hello-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-app
  template:
    metadata:
      labels:
        app: hello-app
    spec:
      containers:
        - name: hello-app
          # Replace with your Artifact Registry image from the Terraform output
          image: <region>-docker.pkg.dev/<project-id>/<your-username>-images/hello-app:latest
          ports:
            - containerPort: 8080
          env:
            - name: STUDENT_NAME
              value: "<your-name>"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
