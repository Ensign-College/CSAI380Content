apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: <your-namespace>
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi # small on purpose — shared-cluster disk quota; plenty for the exercise
  # Omit storageClassName to use the cluster default; record which class was bound in NOTES.md
